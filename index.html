<!DOCTYPE html>
<html lang="ar" dir="rtl" class="notranslate" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="google" content="notranslate">
  <title>For My Love - Hend ❤️</title>
  <style>
    html, body {
      background-color: #000000 !important;
      color: #ffffff;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Twinkling Stars Background */
    .star {
      position: absolute;
      background: #ffffff;
      border-radius: 50%;
      animation: twinkle 3s infinite ease-in-out;
      z-index: 1;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.1; transform: scale(0.7); }
      50% { opacity: 0.9; transform: scale(1.3); }
    }

    /* Page Container */
    .page {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      width: 92%;
      max-width: 410px;
      height: 88vh;
      margin: 6vh auto;
      padding: 20px 10px;
      background: rgba(10, 5, 8, 0.85);
      backdrop-filter: blur(12px);
      border-radius: 30px;
      border: 1px solid rgba(255, 46, 99, 0.35);
      box-shadow: 0 0 35px rgba(255, 46, 99, 0.25);
      position: relative;
      z-index: 10;
      animation: fadeIn 0.6s ease forwards;
    }

    .page.active {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }

    /* Heart Drawing Canvas Area */
    .heart-drawing-canvas {
      position: relative;
      width: 320px;
      height: 310px;
      margin: auto;
    }

    /* Dynamic Words Drawing Effect */
    .drawn-word {
      position: absolute;
      font-weight: 700;
      font-size: 11px;
      white-space: nowrap;
      transform: translate(-50%, -50%) scale(0);
      opacity: 0;
      animation: drawWord 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      padding: 2px 5px;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.4);
    }

    @keyframes drawWord {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0); }
      70% { transform: translate(-50%, -50%) scale(1.15); }
      100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }

    /* Page 2 Styling */
    .title-name {
      font-size: 3rem;
      color: #ff2e63;
      text-shadow: 0 0 20px #ff2e63, 0 0 40px #ff85a1;
      margin-bottom: 10px;
      text-align: center;
    }

    .love-message {
      font-size: 1.15rem;
      line-height: 1.8;
      color: #f1f1f1;
      background: rgba(255, 255, 255, 0.04);
      padding: 20px;
      border-radius: 18px;
      border-right: 4px solid #ff2e63;
      text-align: center;
    }

    /* Page 3 Gallery */
    .gallery {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      width: 100%;
    }

    .photo-card {
      height: 135px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #ff2e63;
      box-shadow: 0 0 10px rgba(255, 46, 99, 0.3);
    }

    .photo-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .audio-player {
      width: 100%;
      margin-top: 10px;
    }

    audio {
      width: 100%;
      height: 38px;
    }

    /* Button */
    .next-btn {
      padding: 12px 50px;
      font-size: 1.1rem;
      font-weight: bold;
      color: #ffffff;
      background: linear-gradient(45deg, #ff2e63, #ff85a1);
      border: none;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(255, 46, 99, 0.7);
    }
  </style>
</head>
<body class="notranslate" translate="no">

  <div id="stars-container"></div>

  <!-- PAGE 1 -->
  <div class="page active" id="page1">
    <h3 style="color: #ff85a1; margin-top: 5px;">علشانك أنتِ بس ❤️</h3>
    
    <!-- Heart drawn word by word -->
    <div class="heart-drawing-canvas" id="heartCanvas"></div>

    <button class="next-btn" onclick="nextPage(2)">Next ➡️</button>
  </div>

  <!-- PAGE 2 -->
  <div class="page" id="page2" style="justify-content: center; gap: 20px;">
    <h1 class="title-name">Hend ❤️</h1>
    <div class="love-message">
      لـ بنتي ونور عيني وأغلى حاجة في حياتي.. <br><br>
      ودي حاجة مني ليكي بمناسبة إني بحبك وبموت فيكي ومش بحب قدك يعني.. <br><br>
      <span style="color: #ff85a1; font-weight: bold;">وخفي نكد عليا شويه 😂😂❤️</span>
    </div>
    <button class="next-btn" onclick="nextPage(3)">Next ➡️</button>
  </div>

  <!-- PAGE 3 -->
  <div class="page" id="page3">
    <h3 style="color: #ff85a1;">ذكرياتنا الجميلة 📸❤️</h3>
    
    <div class="gallery">
      <div class="photo-card"><img src="photo1.jpg" alt="Photo 1"></div>
      <div class="photo-card"><img src="photo2.jpg" alt="Photo 2"></div>
      <div class="photo-card"><img src="photo3.jpg" alt="Photo 3"></div>
      <div class="photo-card"><img src="photo4.jpg" alt="Photo 4"></div>
    </div>

    <div class="audio-player">
      <audio id="bgSong" controls loop>
        <source src="song.mp3" type="audio/mpeg">
      </audio>
    </div>
  </div>

  <script>
    // List of love languages and phrases
    const loveWords = [
      { text: "بحبك", color: "#ff2e63" },
      { text: "I Love You", color: "#ff85a1" },
      { text: "Je t'aime", color: "#ff527b" },
      { text: "Te amo", color: "#ffb3c6" },
      { text: "Ich liebe dich", color: "#ff1e4d" },
      { text: "Ti amo", color: "#ff6699" },
      { text: "أحبك", color: "#ff3366" },
      { text: "Saranghae", color: "#ff99cc" },
      { text: "Aishiteru", color: "#ff4da6" },
      { text: "Я люблю тебя", color: "#ff1a47" },
      { text: "S'agapo", color: "#ff7099" },
      { text: "Mahal kita", color: "#ffa6c1" },
      { text: "Te iubesc", color: "#ff3380" },
      { text: "أموت فيك", color: "#ff0040" },
      { text: "روحي", color: "#ff80b3" },
      { text: "حياتي", color: "#ff4081" },
      { text: "عشقي", color: "#ff1a66" },
      { text: "Nakupenda", color: "#ff99bb" },
      { text: "دوستت دارم", color: "#ff4d79" },
      { text: "Ik hou van jou", color: "#ff2e63" },
      { text: "Aku cinta kamu", color: "#ff66b2" },
      { text: "Seni seviyorum", color: "#ff1a53" }
    ];

    const canvas = document.getElementById('heartCanvas');
    const total = loveWords.length;

    // Distributing words across heart parametric grid smoothly
    loveWords.forEach((item, index) => {
      const t = (index / total) * (2 * Math.PI);
      
      // Mathematical Heart formula for clean outline & distribution
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));

      const posX = 160 + x * 8.5;
      const posY = 140 + y * 8.5;

      const span = document.createElement('span');
      span.className = 'drawn-word notranslate';
      span.setAttribute('translate', 'no');
      span.innerText = item.text;
      span.style.left = `${posX}px`;
      span.style.top = `${posY}px`;
      
      // Unique styling & color per word with sequential glowing animation delay
      span.style.color = item.color;
      span.style.textShadow = `0 0 8px ${item.color}, 0 0 15px #ff2e63`;
      span.style.animationDelay = `${index * 0.12}s`;

      canvas.appendChild(span);
    });

    // Background twinkling stars generator
    const starsContainer = document.getElementById('stars-container');
    for (let i = 0; i < 25; i++) {
      const star = document.createElement('div');
      star.className = 'star';
      star.style.left = `${Math.random() * 100}vw`;
      star.style.top = `${Math.random() * 100}vh`;
      const size = `${2 + Math.random() * 3}px`;
      star.style.width = size;
      star.style.height = size;
      star.style.animationDuration = `${2 + Math.random() * 3}s`;
      star.style.animationDelay = `${Math.random() * 2}s`;
      starsContainer.appendChild(star);
    }

    function nextPage(p) {
      document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
      document.getElementById(`page${p}`).classList.add('active');

      if (p === 3) {
        const audio = document.getElementById('bgSong');
        audio.play().catch(() => {});
      }
    }
  </script>
</body>
</html>
