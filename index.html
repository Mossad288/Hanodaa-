<!DOCTYPE html>
<html lang="ar" dir="rtl" class="notranslate" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="google" content="notranslate">
  <title>Love in Many Languages - Hend ❤️</title>
  <style>
    html, body {
      background-color: #050508 !important;
      color: #ffffff;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Background Stars Effect */
    .star {
      position: absolute;
      background: #ffffff;
      border-radius: 50%;
      animation: twinkle 3s infinite ease-in-out;
      z-index: 1;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    /* Page Container System */
    .page {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      width: 92%;
      max-width: 410px;
      height: 90vh;
      margin: 5vh auto;
      padding: 15px;
      background: rgba(15, 10, 18, 0.7);
      backdrop-filter: blur(10px);
      border-radius: 30px;
      border: 1px solid rgba(255, 46, 99, 0.3);
      box-shadow: 0 0 40px rgba(255, 46, 99, 0.25);
      position: relative;
      z-index: 10;
      animation: fadeIn 0.6s ease forwards;
    }

    .page.active {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }

    /* The Real Heart Block Shape Container */
    .heart-block-container {
      position: relative;
      width: 320px;
      height: 310px;
      margin: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle, rgba(180, 20, 60, 0.85) 0%, rgba(100, 10, 30, 0.95) 70%, rgba(40, 0, 10, 1) 100%);
      /* CSS Mask to shape the container strictly into a Heart */
      -webkit-mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z'/></svg>");
      mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z'/></svg>");
      -webkit-mask-size: contain;
      mask-size: contain;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      -webkit-mask-position: center;
      mask-position: center;
      box-shadow: 0 0 30px rgba(255, 46, 99, 0.6);
      padding: 35px 20px;
      text-align: center;
      animation: heartGlow 2s infinite alternate;
    }

    @keyframes heartGlow {
      from { box-shadow: 0 0 20px rgba(255, 46, 99, 0.5); }
      to { box-shadow: 0 0 35px rgba(255, 100, 130, 0.8); }
    }

    .languages-title {
      font-size: 1.15rem;
      font-weight: bold;
      color: #ffd1dc;
      margin-bottom: 12px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.6);
    }

    /* Words Grid inside the Heart block */
    .words-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 6px 10px;
      max-width: 250px;
    }

    .lang-word {
      font-size: 11px;
      font-weight: 600;
      color: #ffe6ee;
      opacity: 0;
      transform: scale(0.5);
      animation: wordAppear 0.4s ease forwards;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
    }

    @keyframes wordAppear {
      to { opacity: 1; transform: scale(1); }
    }

    /* Page 2 Styling */
    .title-name {
      font-size: 3rem;
      color: #ff2e63;
      text-shadow: 0 0 20px #ff2e63, 0 0 40px #ff85a1;
      margin-bottom: 15px;
      text-align: center;
    }

    .love-message {
      font-size: 1.15rem;
      line-height: 1.8;
      color: #f1f1f1;
      background: rgba(255, 255, 255, 0.05);
      padding: 20px;
      border-radius: 18px;
      border-right: 4px solid #ff2e63;
      text-align: center;
    }

    /* Page 3 Gallery */
    .gallery {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      width: 100%;
    }

    .photo-card {
      height: 140px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #ff2e63;
      box-shadow: 0 0 10px rgba(255, 46, 99, 0.3);
    }

    .photo-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .audio-player {
      width: 100%;
      margin-top: 10px;
    }

    audio {
      width: 100%;
      height: 38px;
    }

    /* Button */
    .next-btn {
      padding: 12px 50px;
      font-size: 1.1rem;
      font-weight: bold;
      color: #ffffff;
      background: linear-gradient(45deg, #ff2e63, #ff85a1);
      border: none;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(255, 46, 99, 0.7);
      margin-bottom: 10px;
    }
  </style>
</head>
<body class="notranslate" translate="no">

  <!-- Background Stars -->
  <div id="stars-container"></div>

  <!-- PAGE 1: Heart Block with Languages -->
  <div class="page active" id="page1">
    <div style="display: flex; justify-content: space-between; width: 100%; align-items: center; padding: 0 10px;">
      <h3 style="color: #ff85a1; font-size: 1rem; margin: 0;">علشانك أنتِ بس ❤️</h3>
      <span style="font-size: 20px;">❤️</span>
    </div>

    <!-- The Heart Mask Block -->
    <div class="heart-block-container">
      <div class="languages-title">Love in 20 Languages</div>
      <div class="words-grid" id="wordsGrid"></div>
    </div>

    <button class="next-btn" onclick="nextPage(2)">Next ➡️</button>
  </div>

  <!-- PAGE 2: Message -->
  <div class="page" id="page2" style="justify-content: center; gap: 20px;">
    <h1 class="title-name">Hend ❤️</h1>
    <div class="love-message">
      لـ بنتي ونور عيني وأغلى حاجة في حياتي.. <br><br>
      ودي حاجة مني ليكي بمناسبة إني بحبك وبموت فيكي ومش بحب قدك يعني.. <br><br>
      <span style="color: #ff85a1; font-weight: bold;">وخفي نكد عليا شويه 😂😂❤️</span>
    </div>
    <button class="next-btn" onclick="nextPage(3)">Next ➡️</button>
  </div>

  <!-- PAGE 3: Gallery & Song -->
  <div class="page" id="page3">
    <h3 style="color: #ff85a1; margin: 5px 0;">ذكرياتنا الجميلة 📸❤️</h3>
    
    <div class="gallery">
      <div class="photo-card"><img src="photo1.jpg" alt="Photo 1"></div>
      <div class="photo-card"><img src="photo2.jpg" alt="Photo 2"></div>
      <div class="photo-card"><img src="photo3.jpg" alt="Photo 3"></div>
      <div class="photo-card"><img src="photo4.jpg" alt="Photo 4"></div>
    </div>

    <div class="audio-player">
      <audio id="bgSong" controls loop>
        <source src="song.mp3" type="audio/mpeg">
      </audio>
    </div>
  </div>

  <script>
    const languagesLove = [
      "بحبك", "I love you", "Je t'aime", "Te amo", "Ich liebe dich", 
      "Ti amo", "أحبك", "Saranghae", "Aishiteru", "Я люблю тебя", 
      "S'agapo", "Mahal kita", "Te iubesc", "Nakupenda", "دوستت دارم",
      "أحبك", "Aku cinta kamu", "मैं तुमसे प्यार करता हूँ", "Ik hou van jou", "Seni seviyorum"
    ];

    const grid = document.getElementById('wordsGrid');
    
    // Populate words with staggered appearance delay
    languagesLove.forEach((lang, index) => {
      const span = document.createElement('span');
      span.className = 'lang-word notranslate';
      span.setAttribute('translate', 'no');
      span.innerText = lang;
      span.style.animationDelay = `${index * 0.1}s`;
      grid.appendChild(span);
    });

    // Create background twinkling stars
    const starsContainer = document.getElementById('stars-container');
    for (let i = 0; i < 25; i++) {
      const star = document.createElement('div');
      star.className = 'star';
      star.style.left = `${Math.random() * 100}vw`;
      star.style.top = `${Math.random() * 100}vh`;
      const size = `${2 + Math.random() * 3}px`;
      star.style.width = size;
      star.style.height = size;
      star.style.animationDuration = `${2 + Math.random() * 3}s`;
      star.style.animationDelay = `${Math.random() * 2}s`;
      starsContainer.appendChild(star);
    }

    function nextPage(p) {
      document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
      document.getElementById(`page${p}`).classList.add('active');

      if (p === 3) {
        const audio = document.getElementById('bgSong');
        audio.play().catch(() => {});
      }
    }
  </script>
</body>
</html>
