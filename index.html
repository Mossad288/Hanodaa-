<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For My Love - Hend ❤️</title>
  <style>
    :root {
      --primary-color: #ff2e63;
      --secondary-color: #ff85a1;
      --dark-bg: #050002;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: var(--dark-bg);
      color: #fff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    /* Floating Background Hearts */
    .floating-heart {
      position: absolute;
      color: var(--primary-color);
      font-size: 14px;
      animation: float 6s infinite linear;
      opacity: 0.4;
      pointer-events: none;
      z-index: 1;
    }

    @keyframes float {
      0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
      50% { opacity: 0.8; }
      100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
    }

    .page {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      width: 92%;
      max-width: 420px;
      height: 88vh;
      max-height: 720px;
      padding: 20px 10px;
      background: rgba(255, 255, 255, 0.02);
      backdrop-filter: blur(15px);
      border-radius: 30px;
      border: 1px solid rgba(255, 46, 99, 0.25);
      box-shadow: 0 0 35px rgba(255, 46, 99, 0.2);
      position: relative;
      z-index: 10;
      animation: fadeIn 0.8s ease-in-out forwards;
    }

    .page.active {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    /* Full Heart Made Of Words */
    .heart-presentation-container {
      position: relative;
      width: 340px;
      height: 340px;
      margin: auto;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .animated-word {
      position: absolute;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      opacity: 0;
      transform: translate(-50%, -50%) scale(0);
      animation: popInWord 0.4s ease-out forwards, glowPulse 2s infinite alternate;
      text-shadow: 0 0 8px var(--primary-color), 0 0 15px var(--secondary-color);
    }

    @keyframes popInWord {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0); }
      70% { transform: translate(-50%, -50%) scale(1.2); }
      100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }

    @keyframes glowPulse {
      from { filter: drop-shadow(0 0 2px #ff2e63); }
      to { filter: drop-shadow(0 0 8px #ff85a1); color: #ffe6ee; }
    }

    /* Page 2 Styling */
    .title-name {
      font-size: 3rem;
      color: var(--primary-color);
      text-shadow: 0 0 20px var(--primary-color), 0 0 35px var(--secondary-color);
      margin-bottom: 15px;
    }

    .love-message {
      font-size: 1.25rem;
      line-height: 1.9;
      color: #f1f1f1;
      background: rgba(0, 0, 0, 0.4);
      padding: 20px;
      border-radius: 20px;
      border-right: 4px solid var(--primary-color);
    }

    /* Page 3 Gallery Styling */
    .gallery {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      width: 100%;
    }

    .photo-card {
      height: 140px;
      border-radius: 15px;
      overflow: hidden;
      border: 2px solid rgba(255, 46, 99, 0.4);
    }

    .photo-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .audio-player {
      width: 100%;
      margin-top: 10px;
    }

    audio {
      width: 100%;
      height: 40px;
    }

    /* Buttons */
    .next-btn {
      padding: 12px 45px;
      font-size: 1.1rem;
      font-weight: bold;
      color: #fff;
      background: linear-gradient(45deg, var(--primary-color), var(--secondary-color));
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(255, 46, 99, 0.6);
      transition: transform 0.2s ease;
    }

    .next-btn:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>

  <div id="hearts-bg"></div>

  <!-- PAGE 1 -->
  <div class="page active" id="page1">
    <h3 style="color: var(--secondary-color); letter-spacing: 1px; margin-top: 5px;">علشانك أنتِ بس ❤️</h3>
    
    <div class="heart-presentation-container" id="heartWordsContainer"></div>

    <button class="next-btn" onclick="nextPage(2)">Next ➡️</button>
  </div>

  <!-- PAGE 2 -->
  <div class="page" id="page2" style="justify-content: center; gap: 20px;">
    <h1 class="title-name">Hend ❤️</h1>
    <div class="love-message">
      لـ بنتي ونور عيني وأغلى حاجة في حياتي.. <br><br>
      ودي حاجة مني ليكي بمناسبة إني بحبك وبموت فيكي ومش بحب قدك يعني.. <br><br>
      <span style="color: var(--secondary-color); font-weight: bold;">وخفي نكد عليا شويه 😂😂❤️</span>
    </div>
    <button class="next-btn" onclick="nextPage(3)">Next ➡️</button>
  </div>

  <!-- PAGE 3 -->
  <div class="page" id="page3">
    <h3 style="color: var(--secondary-color);">ذكرياتنا الجميلة 📸❤️</h3>
    
    <div class="gallery">
      <div class="photo-card"><img src="photo1.jpg" alt="Photo 1"></div>
      <div class="photo-card"><img src="photo2.jpg" alt="Photo 2"></div>
      <div class="photo-card"><img src="photo3.jpg" alt="Photo 3"></div>
      <div class="photo-card"><img src="photo4.jpg" alt="Photo 4"></div>
    </div>

    <div class="audio-player">
      <audio id="bgSong" controls loop>
        <source src="song.mp3" type="audio/mpeg">
      </audio>
    </div>
  </div>

  <script>
    // List of "I love you" in many languages to fill the whole heart shape
    const loveWords = [
      "بحبك", "I Love You", "Je t'aime", "Te amo", "Ich liebe dich", 
      "Ti amo", "أحبك", "Saranghae", "Aishiteru", "Я тебя люблю", 
      "S'agapo", "Mahal kita", "Te iubesc", "أموت فيك", "روحي", 
      "حياتي", "عشقي", "بحبك", "I Love You", "Je t'aime", "Te amo", 
      "Ich liebe dich", "Ti amo", "أحبك", "Saranghae", "Aishiteru", 
      "Я тебя люблю", "S'agapo", "Mahal kita", "Te iubesc", "أموت فيك", 
      "بحبك", "I Love You", "Je t'aime", "Te amo", "Ich liebe dich",
      "Ti amo", "أحبك", "Saranghae", "Aishiteru", "بحبك", "عشقي"
    ];

    const container = document.getElementById('heartWordsContainer');
    const totalWords = loveWords.length;

    // Mathematical formula for generating coordinates of a heart shape filled with text
    loveWords.forEach((word, index) => {
      const t = (index / totalWords) * (2 * Math.PI);
      
      // Heart parametric equation
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));

      // Scaling for mobile display
      const posX = 170 + x * 9.5;
      const posY = 150 + y * 9.5;

      const span = document.createElement('span');
      span.className = 'animated-word';
      span.innerText = word;
      span.style.left = `${posX}px`;
      span.style.top = `${posY}px`;
      
      // Dynamic font sizing for inner vs outer placement
      span.style.fontSize = (index % 3 === 0) ? '12px' : '10px';
      
      // Sequential animation delay to draw the heart live
      span.style.animationDelay = `${index * 0.08}s, ${index * 0.08 + 0.4}s`;

      container.appendChild(span);
    });

    // Background floating hearts
    const heartsBg = document.getElementById('hearts-bg');
    for (let i = 0; i < 20; i++) {
      const heart = document.createElement('div');
      heart.className = 'floating-heart';
      heart.innerHTML = '❤️';
      heart.style.left = `${Math.random() * 100}vw`;
      heart.style.animationDuration = `${4 + Math.random() * 4}s`;
      heart.style.animationDelay = `${Math.random() * 3}s`;
      heartsBg.appendChild(heart);
    }

    // Page navigation logic
    function nextPage(pageNumber) {
      document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
      document.getElementById(`page${pageNumber}`).classList.add('active');

      if (pageNumber === 3) {
        const audio = document.getElementById('bgSong');
        audio.play().catch(err => console.log("Audio autoplay blocked"));
      }
    }
  </script>
</body>
</html>
