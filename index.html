<!DOCTYPE html>
<html lang="ar" dir="rtl" class="notranslate" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="google" content="notranslate">
  <title>For My Love - Hend ❤️</title>
  <style>
    html, body {
      background-color: #000000 !important;
      color: #ffffff;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Twinkling Background Stars */
    .star {
      position: absolute;
      background: #ffffff;
      border-radius: 50%;
      animation: twinkle 3s infinite ease-in-out;
      z-index: 1;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.1; transform: scale(0.8); }
      50% { opacity: 0.8; transform: scale(1.2); }
    }

    /* Page Container */
    .page {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      width: 92%;
      max-width: 400px;
      height: 88vh;
      margin: 6vh auto;
      padding: 20px 10px;
      background: rgba(10, 5, 8, 0.9);
      backdrop-filter: blur(12px);
      border-radius: 30px;
      border: 1px solid rgba(255, 46, 99, 0.35);
      box-shadow: 0 0 35px rgba(255, 46, 99, 0.25);
      position: relative;
      z-index: 10;
      animation: fadeIn 0.6s ease forwards;
    }

    .page.active {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }

    /* Exact Filled Heart Block Matching Reference Image */
    .heart-container {
      position: relative;
      width: 320px;
      height: 310px;
      margin: auto;
      background: radial-gradient(circle, rgba(185, 15, 55, 0.85) 0%, rgba(100, 8, 30, 0.95) 70%, rgba(40, 0, 10, 1) 100%);
      -webkit-mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z'/></svg>");
      mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z'/></svg>");
      -webkit-mask-size: 96% 96%;
      mask-size: 96% 96%;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      -webkit-mask-position: center;
      mask-position: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 15px;
      box-shadow: 0 0 35px rgba(255, 46, 99, 0.6);
    }

    .heart-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #ffccd5;
      margin-bottom: 12px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.7);
    }

    .words-matrix {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 5px 8px;
      width: 100%;
      max-width: 260px;
      text-align: center;
    }

    .matrix-word {
      font-size: 11px;
      font-weight: 600;
      color: #ffe6ee;
      opacity: 0;
      transform: scale(0.5);
      animation: wordPop 0.4s ease forwards;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }

    @keyframes wordPop {
      to { opacity: 1; transform: scale(1); }
    }

    /* Page 2 Styling */
    .title-name {
      font-size: 3rem;
      color: #ff2e63;
      text-shadow: 0 0 20px #ff2e63, 0 0 40px #ff85a1;
      margin-bottom: 10px;
      text-align: center;
    }

    .love-message {
      font-size: 1.15rem;
      line-height: 1.8;
      color: #f1f1f1;
      background: rgba(255, 255, 255, 0.04);
      padding: 20px;
      border-radius: 18px;
      border-right: 4px solid #ff2e63;
      text-align: center;
    }

    /* Page 3 Gallery */
    .gallery {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      width: 100%;
    }

    .photo-card {
      height: 135px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #ff2e63;
      box-shadow: 0 0 10px rgba(255, 46, 99, 0.3);
    }

    .photo-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .audio-player {
      width: 100%;
      margin-top: 10px;
    }

    audio {
      width: 100%;
      height: 38px;
    }

    /* Button */
    .next-btn {
      padding: 12px 50px;
      font-size: 1.1rem;
      font-weight: bold;
      color: #ffffff;
      background: linear-gradient(45deg, #ff2e63, #ff85a1);
      border: none;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(255, 46, 99, 0.7);
    }
  </style>
</head>
<body class="notranslate" translate="no">

  <div id="stars-container"></div>

  <!-- PAGE 1 -->
  <div class="page active" id="page1">
    <div style="display: flex; justify-content: space-between; width: 100%; align-items: center; padding: 0 5px;">
      <h3 style="color: #ff85a1; margin: 0; font-size: 0.95rem;">علشانك أنتِ بس ❤️</h3>
      <span style="font-size: 18px;">❤️</span>
    </div>
    
    <!-- Exact Reference Heart Block -->
    <div class="heart-container">
      <div class="heart-title">Love in 20 Languages</div>
      <div class="words-matrix" id="wordsMatrix"></div>
    </div>

    <button class="next-btn" onclick="nextPage(2)">Next ➡️</button>
  </div>

  <!-- PAGE 2 -->
  <div class="page" id="page2" style="justify-content: center; gap: 20px;">
    <h1 class="title-name">Hend ❤️</h1>
    <div class="love-message">
      لـ بنتي ونور عيني وأغلى حاجة في حياتي.. <br><br>
      ودي حاجة مني ليكي بمناسبة إني بحبك وبموت فيكي ومش بحب قدك يعني.. <br><br>
      <span style="color: #ff85a1; font-weight: bold;">وخفي نكد عليا شويه 😂😂❤️</span>
    </div>
    <button class="next-btn" onclick="nextPage(3)">Next ➡️</button>
  </div>

  <!-- PAGE 3 -->
  <div class="page" id="page3">
    <h3 style="color: #ff85a1;">ذكرياتنا الجميلة 📸❤️</h3>
    
    <div class="gallery">
      <div class="photo-card"><img src="photo1.jpg" alt="Photo 1"></div>
      <div class="photo-card"><img src="photo2.jpg" alt="Photo 2"></div>
      <div class="photo-card"><img src="photo3.jpg" alt="Photo 3"></div>
      <div class="photo-card"><img src="photo4.jpg" alt="Photo 4"></div>
    </div>

    <div class="audio-player">
      <audio id="bgSong" controls loop>
        <source src="song.mp3" type="audio/mpeg">
      </audio>
    </div>
  </div>

  <script>
    const languagesList = [
      "أحبك", "Aku cinta kamu", "আমি তোমাকে ভালোবাসি", 
      "Ik hou van jou", "Eu te amo", "I love you", "Σ' αγαπώ", 
      "السَّلام", "Saranghae", "أحبك", "Ti amo", "Ich liebe dich", 
      "Я люблю тебя", "Te amo", "Seni seviyorum", "Nakupenda", 
      "Te iubesc", "Mahal kita", "دوستت دارم", "मैं तुमसे प्यार करता हूँ"
    ];

    const matrix = document.getElementById('wordsMatrix');

    // Generating words matching the exact visual style and flow
    languagesList.forEach((lang, index) => {
      const span = document.createElement('span');
      span.className = 'matrix-word notranslate';
      span.setAttribute('translate', 'no');
      span.innerText = lang;
      span.style.animationDelay = `${index * 0.08}s`;
      matrix.appendChild(span);
    });

    // Twinkling stars
    const starsContainer = document.getElementById('stars-container');
    for (let i = 0; i < 25; i++) {
      const star = document.createElement('div');
      star.className = 'star';
      star.style.left = `${Math.random() * 100}vw`;
      star.style.top = `${Math.random() * 100}vh`;
      const size = `${2 + Math.random() * 3}px`;
      star.style.width = size;
      star.style.height = size;
      star.style.animationDuration = `${2 + Math.random() * 3}s`;
      star.style.animationDelay = `${Math.random() * 2}s`;
      starsContainer.appendChild(star);
    }

    function nextPage(p) {
      document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
      document.getElementById(`page${p}`).classList.add('active');

      if (p === 3) {
        const audio = document.getElementById('bgSong');
        audio.play().catch(() => {});
      }
    }
  </script>
</body>
</html>
