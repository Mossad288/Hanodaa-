<!DOCTYPE html>
<html lang="ar" dir="rtl" class="notranslate" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="google" content="notranslate">
  <title>For My Love - Hend ❤️</title>
  <style>
    html, body {
      background-color: #000000 !important;
      color: #ffffff;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Floating Hearts Background */
    .floating-heart {
      position: absolute;
      color: #ff2e63;
      font-size: 14px;
      animation: floatUp 5s infinite linear;
      opacity: 0.5;
      pointer-events: none;
      z-index: 1;
    }

    @keyframes floatUp {
      0% { transform: translateY(100vh) scale(0.6); opacity: 0; }
      50% { opacity: 0.8; }
      100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
    }

    /* Page Container */
    .page {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      width: 92%;
      max-width: 390px;
      height: 88vh;
      margin: 6vh auto;
      padding: 20px 10px;
      background: #050505;
      border-radius: 25px;
      border: 1px solid rgba(255, 46, 99, 0.4);
      box-shadow: 0 0 30px rgba(255, 46, 99, 0.25);
      position: relative;
      z-index: 10;
      animation: fadeIn 0.6s ease forwards;
    }

    .page.active {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }

    /* Clean Heart Shape Matrix */
    .heart-canvas {
      position: relative;
      width: 300px;
      height: 280px;
      margin: auto;
    }

    .heart-word {
      position: absolute;
      color: #ff3366;
      font-weight: bold;
      font-size: 11px;
      white-space: nowrap;
      transform: translate(-50%, -50%);
      opacity: 0;
      animation: popWord 0.4s ease forwards, glowPulse 2s infinite alternate;
      text-shadow: 0 0 5px #ff2e63;
      padding: 2px 4px;
    }

    @keyframes popWord {
      to { opacity: 1; }
    }

    @keyframes glowPulse {
      from { text-shadow: 0 0 4px #ff2e63; color: #ff3366; }
      to { text-shadow: 0 0 10px #ff85a1, 0 0 18px #ff2e63; color: #ffffff; }
    }

    /* Page 2 Styling */
    .title-name {
      font-size: 3rem;
      color: #ff2e63;
      text-shadow: 0 0 20px #ff2e63, 0 0 40px #ff85a1;
      margin-bottom: 10px;
      text-align: center;
    }

    .love-message {
      font-size: 1.15rem;
      line-height: 1.8;
      color: #f1f1f1;
      background: rgba(255, 255, 255, 0.04);
      padding: 20px;
      border-radius: 18px;
      border-right: 4px solid #ff2e63;
      text-align: center;
    }

    /* Page 3 Gallery */
    .gallery {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      width: 100%;
    }

    .photo-card {
      height: 135px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #ff2e63;
      box-shadow: 0 0 10px rgba(255, 46, 99, 0.3);
    }

    .photo-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .audio-player {
      width: 100%;
      margin-top: 10px;
    }

    audio {
      width: 100%;
      height: 38px;
    }

    /* Button */
    .next-btn {
      padding: 12px 50px;
      font-size: 1.1rem;
      font-weight: bold;
      color: #ffffff;
      background: linear-gradient(45deg, #ff2e63, #ff85a1);
      border: none;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(255, 46, 99, 0.7);
    }
  </style>
</head>
<body class="notranslate" translate="no">

  <div id="hearts-bg"></div>

  <!-- PAGE 1 -->
  <div class="page active" id="page1">
    <h3 style="color: #ff85a1; margin-top: 5px;">علشانك أنتِ بس ❤️</h3>
    
    <div class="heart-canvas" id="heartCanvas"></div>

    <button class="next-btn" onclick="nextPage(2)">Next ➡️</button>
  </div>

  <!-- PAGE 2 -->
  <div class="page" id="page2" style="justify-content: center; gap: 20px;">
    <h1 class="title-name">Hend ❤️</h1>
    <div class="love-message">
      لـ بنتي ونور عيني وأغلى حاجة في حياتي.. <br><br>
      ودي حاجة مني ليكي بمناسبة إني بحبك وبموت فيكي ومش بحب قدك يعني.. <br><br>
      <span style="color: #ff85a1; font-weight: bold;">وخفي نكد عليا شويه 😂😂❤️</span>
    </div>
    <button class="next-btn" onclick="nextPage(3)">Next ➡️</button>
  </div>

  <!-- PAGE 3 -->
  <div class="page" id="page3">
    <h3 style="color: #ff85a1;">ذكرياتنا الجميلة 📸❤️</h3>
    
    <div class="gallery">
      <div class="photo-card"><img src="photo1.jpg" alt="Photo 1"></div>
      <div class="photo-card"><img src="photo2.jpg" alt="Photo 2"></div>
      <div class="photo-card"><img src="photo3.jpg" alt="Photo 3"></div>
      <div class="photo-card"><img src="photo4.jpg" alt="Photo 4"></div>
    </div>

    <div class="audio-player">
      <audio id="bgSong" controls loop>
        <source src="song.mp3" type="audio/mpeg">
      </audio>
    </div>
  </div>

  <script>
    // Selected words distributed evenly to avoid any overlapping
    const loveWords = [
      "بحبك", "I Love You", "Je t'aime", "Te amo", "Ich liebe dich", 
      "Ti amo", "أحبك", "Saranghae", "Aishiteru", "Я люблю тебя", 
      "S'agapo", "Mahal kita", "Te iubesc", "أموت فيك", "روحي", 
      "حياتي", "عشقي", "Te amo", "Je t'aime", "I Love You", "بحبك",
      "Saranghae", "Ich liebe dich", "أحبك", "Ti amo", "Mahal kita"
    ];

    const canvas = document.getElementById('heartCanvas');
    const total = loveWords.length;

    // Precise Heart Parametric Equation mapping
    loveWords.forEach((word, index) => {
      const t = (index / total) * (2 * Math.PI);
      
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));

      // Spacing and scaling adjusted perfectly for mobile screens
      const posX = 150 + x * 8;
      const posY = 135 + y * 8;

      const span = document.createElement('span');
      span.className = 'heart-word notranslate';
      span.setAttribute('translate', 'no');
      span.innerText = word;
      span.style.left = `${posX}px`;
      span.style.top = `${posY}px`;
      span.style.animationDelay = `${index * 0.06}s, ${index * 0.06 + 0.3}s`;

      canvas.appendChild(span);
    });

    // Background floating hearts
    const bg = document.getElementById('hearts-bg');
    for (let i = 0; i < 15; i++) {
      const h = document.createElement('div');
      h.className, h.className = 'floating-heart';
      h.innerHTML = '❤️';
      h.style.left = `${Math.random() * 100}vw`;
      h.style.animationDuration = `${4 + Math.random() * 3}s`;
      h.style.animationDelay = `${Math.random() * 2}s`;
      bg.appendChild(h);
    }

    function nextPage(p) {
      document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
      document.getElementById(`page${p}`).classList.add('active');

      if (p === 3) {
        const audio = document.getElementById('bgSong');
        audio.play().catch(() => {});
      }
    }
  </script>
</body>
</html>
