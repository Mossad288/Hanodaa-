<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For My Love - Hend ❤️</title>
  <style>
    :root {
      --primary-color: #ff2e63;
      --secondary-color: #ff85a1;
      --dark-bg: #100007;
      --gold-glow: #ffe600;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: var(--dark-bg);
      color: #fff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      position: relative;
    }

    /* Floating Background Hearts */
    .floating-heart {
      position: absolute;
      color: var(--primary-color);
      font-size: 20px;
      animation: float 6s infinite linear;
      opacity: 0.6;
      pointer-events: none;
      z-index: 1;
    }

    @keyframes float {
      0% { transform: translateY(100vh) scale(0.5) rotate(0deg); opacity: 0; }
      50% { opacity: 0.8; }
      100% { transform: translateY(-10vh) scale(1.2) rotate(360deg); opacity: 0; }
    }

    /* Page Container System */
    .page {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 90%;
      max-width: 800px;
      min-height: 85vh;
      text-align: center;
      padding: 30px;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(12px);
      border-radius: 25px;
      border: 1px solid rgba(255, 46, 99, 0.3);
      box-shadow: 0 0 30px rgba(255, 46, 99, 0.2);
      position: relative;
      z-index: 10;
      animation: fadeIn 0.8s ease-in-out forwards;
    }

    .page.active {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    /* Page 1: Heart Shape Text */
    .heart-wrapper {
      position: relative;
      width: 320px;
      height: 320px;
      margin: 20px auto;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .heart-text-container {
      position: absolute;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .love-word {
      position: absolute;
      font-size: 13px;
      font-weight: bold;
      color: #ff4d6d;
      text-shadow: 0 0 8px #ff2e63, 0 0 15px #ff85a1;
      white-space: nowrap;
      transform: translate(-50%, -50%);
      animation: pulseGlow 2s infinite alternate;
    }

    .heart-center-glow {
      font-size: 45px;
      color: var(--primary-color);
      text-shadow: 0 0 20px var(--primary-color), 0 0 40px var(--secondary-color);
      animation: heartBeat 1.2s infinite ease-in-out;
    }

    @keyframes heartBeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.25); }
    }

    @keyframes pulseGlow {
      from { filter: brightness(1); }
      to { filter: brightness(1.6); }
    }

    /* Page 2: Name & Message */
    .title-name {
      font-size: 3.5rem;
      color: var(--primary-color);
      text-shadow: 0 0 20px var(--primary-color), 0 0 35px var(--secondary-color);
      margin-bottom: 25px;
      letter-spacing: 2px;
    }

    .love-message {
      font-size: 1.4rem;
      line-height: 2;
      color: #f1f1f1;
      background: rgba(0, 0, 0, 0.4);
      padding: 25px;
      border-radius: 18px;
      border-right: 4px solid var(--primary-color);
      box-shadow: inset 0 0 15px rgba(255, 46, 99, 0.1);
    }

    /* Page 3: Photo Gallery & Music */
    .gallery {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      width: 100%;
      margin-top: 15px;
    }

    .photo-card {
      position: relative;
      border-radius: 15px;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
      transition: transform 0.3s ease, border-color 0.3s ease;
      height: 180px;
    }

    .photo-card:hover {
      transform: translateY(-5px) scale(1.02);
      border-color: var(--primary-color);
    }

    .photo-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .audio-player {
      margin-top: 25px;
      width: 100%;
      background: rgba(255, 255, 255, 0.08);
      padding: 12px;
      border-radius: 50px;
      border: 1px solid var(--primary-color);
    }

    audio {
      width: 100%;
      height: 35px;
      outline: none;
    }

    /* Buttons */
    .next-btn {
      margin-top: 30px;
      padding: 12px 40px;
      font-size: 1.1rem;
      font-weight: bold;
      color: #fff;
      background: linear-gradient(45deg, var(--primary-color), var(--secondary-color));
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(255, 46, 99, 0.5);
      transition: all 0.3s ease;
    }

    .next-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 0 25px rgba(255, 46, 99, 0.8);
    }

    @media (max-width: 600px) {
      .gallery { grid-template-columns: 1fr; }
      .photo-card { height: 200px; }
      .title-name { font-size: 2.8rem; }
      .love-message { font-size: 1.1rem; }
    }
  </style>
</head>
<body>

  <!-- Floating Hearts Background -->
  <div id="hearts-bg"></div>

  <!-- Page 1: Heart Presentation -->
  <div class="page active" id="page1">
    <h2 style="margin-bottom: 10px; color: #ff85a1;">علشانك أنتِ بس ❤️</h2>
    <div class="heart-wrapper">
      <div class="heart-center-glow">❤️</div>
      <div class="heart-text-container" id="heartContainer"></div>
    </div>
    <button class="next-btn" onclick="nextPage(2)">Next ➡️</button>
  </div>

  <!-- Page 2: Name & Special Message -->
  <div class="page" id="page2">
    <h1 class="title-name">Hend ❤️</h1>
    <div class="love-message">
      لـ بنتي ونور عيني وأغلى حاجة في حياتي.. <br>
      ودي حاجة مني ليكي بمناسبة إني بحبك وبموت فيكي ومش بحب قدك يعني.. <br>
      <span style="color: var(--secondary-color); font-weight: bold;">وخفي نكد عليا شويه 😂😂❤️</span>
    </div>
    <button class="next-btn" onclick="nextPage(3)">Next ➡️</button>
  </div>

  <!-- Page 3: Photos & Song -->
  <div class="page" id="page3">
    <h2 style="color: var(--secondary-color); margin-bottom: 15px;">ذكرياتنا الجميلة 📸❤️</h2>
    <div class="gallery">
      <div class="photo-card"><img src="photo1.jpg" alt="Photo 1"></div>
      <div class="photo-card"><img src="photo2.jpg" alt="Photo 2"></div>
      <div class="photo-card"><img src="photo3.jpg" alt="Photo 3"></div>
      <div class="photo-card"><img src="photo4.jpg" alt="Photo 4"></div>
    </div>

    <div class="audio-player">
      <audio id="bgSong" controls loop>
        <source src="song.mp3" type="audio/mpeg">
        متصفحك لا يدعم مشغل الصوت.
      </audio>
    </div>
  </div>

  <script>
    // Words for "I Love You" in various languages
    const loveWords = [
      "بحبك", "I Love You", "Je t'aime", "Te amo", "Ich liebe dich", 
      "Ti amo", "أحبك", "Saranghae", "Aishiteru", "Я тебя люблю", 
      "S'agapo", "Mahal kita", "بحبك", "Te iubesc", "اموت فيك"
    ];

    // Generate Heart Shape using Mathematical Parametric Equations
    const container = document.getElementById('heartContainer');
    const totalPoints = 32;

    for (let i = 0; i < totalPoints; i++) {
      const t = (i / totalPoints) * (2 * Math.PI);
      
      // Heart Equation
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));

      // Scale and Center Offset
      const posX = 160 + x * 8.5;
      const posY = 150 + y * 8.5;

      const span = document.createElement('span');
      span.className = 'love-word';
      span.innerText = loveWords[i % loveWords.length];
      span.style.left = `${posX}px`;
      span.style.top = `${posY}px`;
      
      container.appendChild(span);
    }

    // Floating background hearts generator
    const heartsBg = document.getElementById('hearts-bg');
    for (let i = 0; i < 25; i++) {
      const heart = document.createElement('div');
      heart.className = 'floating-heart';
      heart.innerHTML = '❤️';
      heart.style.left = `${Math.random() * 100}vw`;
      heart.style.animationDuration = `${4 + Math.random() * 5}s`;
      heart.style.animationDelay = `${Math.random() * 3}s`;
      heartsBg.appendChild(heart);
    }

    // Page Navigation
    function nextPage(pageNumber) {
      document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
      document.getElementById(`page${pageNumber}`).classList.add('active');

      // Play audio automatically when reaching Page 3
      if (pageNumber === 3) {
        const audio = document.getElementById('bgSong');
        audio.play().catch(err => console.log("Auto-play blocked by browser. Click play manually."));
      }
    }
  </script>
</body>
</html>
